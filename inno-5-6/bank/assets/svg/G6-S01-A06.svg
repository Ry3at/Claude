<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Vazirmatn, Tahoma, sans-serif">
<rect x="0" y="0" width="900" height="410" rx="0" fill="#F2F5FF"/>
<rect x="0" y="0" width="900" height="10" rx="0" fill="#2D3A8C"/>
<text x="870" y="56" font-family="Vazirmatn, Tahoma, sans-serif" font-size="27" fill="#1E2761" font-weight="700" text-anchor="start" direction="rtl">رسمی یا خودمانی؟</text>
<text x="870" y="84" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" fill="#8C97AB" font-weight="400" text-anchor="start" direction="rtl">یک خواسته، دو لحن</text>
<rect x="470" y="130" width="400" height="100" rx="18" fill="#FFFFFF" stroke="#2D3A8C" stroke-width="3"/>
<polygon points="812,228.5 836,228.5 846.4,252" fill="#FFFFFF"/>
<line x1="836" y1="230" x2="846.4" y2="252" stroke="#2D3A8C" stroke-width="3" stroke-linecap="round"/>
<line x1="812" y1="230" x2="846.4" y2="252" stroke="#2D3A8C" stroke-width="3" stroke-linecap="round"/>
<text x="670" y="187.2" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" fill="#3C4A5E" font-weight="600" text-anchor="middle" direction="rtl">«لطفاً در را ببندید.»</text>
<rect x="30" y="130" width="400" height="100" rx="18" fill="#FFF6DC" stroke="#FFC93C" stroke-width="3"/>
<polygon points="64,228.5 88,228.5 53.6,252" fill="#FFF6DC"/>
<line x1="64" y1="230" x2="53.6" y2="252" stroke="#FFC93C" stroke-width="3" stroke-linecap="round"/>
<line x1="88" y1="230" x2="53.6" y2="252" stroke="#FFC93C" stroke-width="3" stroke-linecap="round"/>
<text x="230" y="187.2" font-family="Vazirmatn, Tahoma, sans-serif" font-size="20" fill="#3C4A5E" font-weight="600" text-anchor="middle" direction="rtl">«درو ببند دیگه!»</text>
<rect x="610" y="273" width="120" height="32.3" rx="16.15" fill="#2D3A8C"/>
<text x="670" y="295.12" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">رسمی</text>
<rect x="170" y="273" width="120" height="32.3" rx="16.15" fill="#FFC93C"/>
<text x="230" y="295.12" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">خودمانی</text>
<text x="670" y="335" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15" fill="#8C97AB" font-weight="500" text-anchor="middle" direction="rtl">کامل، مؤدب، کتابی</text>
<text x="230" y="335" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15" fill="#8C97AB" font-weight="500" text-anchor="middle" direction="rtl">کوتاه، شکسته، مثل حرف‌زدن</text>
<text x="450" y="385" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15.5" fill="#3C4A5E" font-weight="400" text-anchor="middle" direction="rtl">در بازی امروز همین را تشخیص می‌دهی: رسمی یا خودمانی، ساده یا پرجزئیات.</text>
</svg>
