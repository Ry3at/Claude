<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Vazirmatn, Tahoma, sans-serif">
<rect x="0" y="0" width="900" height="410" rx="0" fill="#F2F5FF"/>
<rect x="0" y="0" width="900" height="10" rx="0" fill="#2D3A8C"/>
<text x="870" y="56" font-family="Vazirmatn, Tahoma, sans-serif" font-size="27" fill="#1E2761" font-weight="700" text-anchor="start" direction="rtl">اصالت با تازگی فرق دارد</text>
<text x="870" y="84" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" fill="#8C97AB" font-weight="400" text-anchor="start" direction="rtl">اثر لازم نیست بی‌نظیر باشد تا مال تو باشد</text>
<rect x="470" y="120" width="400" height="200" rx="16" fill="#FFFFFF" stroke="#D7DEF2" stroke-width="2"/>
<rect x="470" y="120" width="400" height="46" rx="16" fill="#2E9E5B"/>
<rect x="470" y="143" width="400" height="23" rx="0" fill="#2E9E5B"/>
<text x="670" y="150" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">اصالت</text>
<text x="670" y="200" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">ردّ انتخاب و دست تو</text>
<text x="670" y="228.875" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">حتی با قاعده‌ی آشنا</text>
<text x="670" y="257.75" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">مال تو می‌ماند</text>
<rect x="30" y="120" width="400" height="200" rx="16" fill="#FFFFFF" stroke="#D7DEF2" stroke-width="2"/>
<rect x="30" y="120" width="400" height="46" rx="16" fill="#FF6B6B"/>
<rect x="30" y="143" width="400" height="23" rx="0" fill="#FF6B6B"/>
<text x="230" y="150" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">تازگی</text>
<text x="230" y="200" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">چیزی که قبلاً نبوده</text>
<text x="230" y="228.875" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">ممکن است هیچ ردّی</text>
<text x="230" y="257.75" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">از تو نداشته باشد</text>
<text x="450" y="380" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="#3C4A5E" font-weight="400" text-anchor="middle" direction="rtl">نقاشیِ امروزت با قاعده‌ی خودت کشیده می‌شود؛ پس مال توست.</text>
</svg>
