<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Vazirmatn, Tahoma, sans-serif">
<rect x="0" y="0" width="900" height="400" rx="0" fill="#F2F5FF"/>
<rect x="0" y="0" width="900" height="10" rx="0" fill="#2D3A8C"/>
<text x="870" y="56" font-family="Vazirmatn, Tahoma, sans-serif" font-size="27" fill="#1E2761" font-weight="700" text-anchor="start" direction="rtl">یک صحنه، دو سبک</text>
<text x="870" y="84" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" fill="#8C97AB" font-weight="400" text-anchor="start" direction="rtl">هر دو جمله درباره‌ی یک صبحانه‌اند</text>
<rect x="470" y="120" width="400" height="210" rx="16" fill="#FFFFFF" stroke="#D7DEF2" stroke-width="2"/>
<rect x="470" y="120" width="400" height="46" rx="16" fill="#06BEB6"/>
<rect x="470" y="143" width="400" height="23" rx="0" fill="#06BEB6"/>
<text x="670" y="150" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">ساده و مستقیم</text>
<svg x="645" y="185" width="50" height="50" viewBox="0 0 512 512" fill="#06BEB6"><path d="M79.18 282.94a32.005 32.005 0 0 0-20.24 20.24L0 480l4.69 4.69 92.89-92.89c-.66-2.56-1.57-5.03-1.57-7.8 0-17.67 14.33-32 32-32s32 14.33 32 32-14.33 32-32 32c-2.77 0-5.24-.91-7.8-1.57l-92.89 92.89L32 512l176.82-58.94a31.983 31.983 0 0 0 20.24-20.24l33.07-84.07-98.88-98.88-84.07 33.07zM369.25 28.32L186.14 227.81l97.85 97.85 199.49-183.11C568.4 67.48 443.73-55.94 369.25 28.32z"></path></svg>
<text x="670" y="288" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">صبحانه خوردم.</text>
<rect x="30" y="120" width="400" height="210" rx="16" fill="#FFFFFF" stroke="#D7DEF2" stroke-width="2"/>
<rect x="30" y="120" width="400" height="46" rx="16" fill="#FF6B6B"/>
<rect x="30" y="143" width="400" height="23" rx="0" fill="#FF6B6B"/>
<text x="230" y="150" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">پرجزئیات</text>
<svg x="205" y="185" width="50" height="50" viewBox="0 0 512 512" fill="#FF6B6B"><path d="M512 0C460.22 3.56 96.44 38.2 71.01 287.61c-3.09 26.66-4.84 53.44-5.99 80.24l178.87-178.69c6.25-6.25 16.4-6.25 22.65 0s6.25 16.38 0 22.63L7.04 471.03c-9.38 9.37-9.38 24.57 0 33.94 9.38 9.37 24.59 9.37 33.98 0l57.13-57.07c42.09-.14 84.15-2.53 125.96-7.36 53.48-5.44 97.02-26.47 132.58-56.54H255.74l146.79-48.88c11.25-14.89 21.37-30.71 30.45-47.12h-81.14l106.54-53.21C500.29 132.86 510.19 26.26 512 0z"></path></svg>
<text x="230" y="288" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">صبح زود، نان داغ و پنیر را</text>
<text x="230" y="316.875" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">کنار پنجره با چای شیرین خوردم.</text>
<text x="450" y="370" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="#8C97AB" font-weight="400" text-anchor="middle" direction="rtl">محتوا یکی است؛ فرقشان در انتخاب واژه‌ها و جزئیات است — یعنی سبک.</text>
</svg>
