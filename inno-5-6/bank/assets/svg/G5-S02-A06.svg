<text x="190" y="345" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15.5" fill="#3C4A5E" font-weight="600" text-anchor="middle" direction="rtl">قطعه‌ی «ث» الگو را می‌شکند:</text>
<text x="190" y="371" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15.5" fill="#3C4A5E" font-weight="600" text-anchor="middle" direction="rtl">خشک است و آب لازم دارد.</text>
<text x="450" y="438" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="#8C97AB" font-weight="400" text-anchor="middle" direction="rtl">داده را بخوان، نه اینکه کدام قطعه سبزتر به نظر می‌رسد.</text>
