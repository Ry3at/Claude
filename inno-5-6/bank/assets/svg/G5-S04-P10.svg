<text x="788" y="233" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#3C4A5E" font-weight="500" text-anchor="start" direction="rtl">یک نشانه به درخواست اضافه کن</text>
<rect x="30" y="280" width="840" height="70" rx="14" fill="#FFFFFF" stroke="#D7DEF2" stroke-width="2"/>
<circle cx="835" cy="315" r="22.4" fill="#FF6B6B"/>
