<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Vazirmatn, Tahoma, sans-serif">
<rect x="0" y="0" width="900" height="470" rx="0" fill="#F2F5FF"/>
<rect x="0" y="0" width="900" height="10" rx="0" fill="#2D3A8C"/>
<text x="870" y="56" font-family="Vazirmatn, Tahoma, sans-serif" font-size="27" fill="#1E2761" font-weight="700" text-anchor="start" direction="rtl">مثال: مشخصات دقیق یعنی چه؟</text>
<text x="870" y="84" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" fill="#8C97AB" font-weight="400" text-anchor="start" direction="rtl">یک خواسته، دو جور توضیح</text>
<rect x="470" y="120" width="400" height="260" rx="16" fill="#FFFFFF" stroke="#D7DEF2" stroke-width="2"/>
<rect x="470" y="120" width="400" height="46" rx="16" fill="#FF6B6B"/>
<rect x="470" y="143" width="400" height="23" rx="0" fill="#FF6B6B"/>
<text x="670" y="150" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">مبهم</text>
<text x="670" y="200" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">«یک بازی بساز.»</text>
<text x="670" y="228.875" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl"></text>
<text x="670" y="257.75" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">چه بازی‌ای؟ چه کسی؟</text>
<text x="670" y="286.625" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">چطور برنده می‌شویم؟</text>
<rect x="30" y="120" width="400" height="260" rx="16" fill="#FFFFFF" stroke="#D7DEF2" stroke-width="2"/>
<rect x="30" y="120" width="400" height="46" rx="16" fill="#2E9E5B"/>
<rect x="30" y="143" width="400" height="23" rx="0" fill="#2E9E5B"/>
<text x="230" y="150" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle" direction="rtl">دقیق</text>
<text x="230" y="200" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">بازی‌ای که گربه با کلید چپ و راست</text>
<text x="230" y="228.875" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">حرکت کند و با گرفتن هر ماهی</text>
<text x="230" y="257.75" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">یک امتیاز بگیرد؛ با سه بار</text>
<text x="230" y="286.625" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16.5" fill="#3C4A5E" font-weight="500" text-anchor="middle" direction="rtl">خوردن به سنگ، بازی تمام شود.</text>
<text x="450" y="430" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="#3C4A5E" font-weight="400" text-anchor="middle" direction="rtl">هر جمله‌ی دقیق، یک تصمیم است که تو گرفته‌ای، نه ابزار.</text>
</svg>
