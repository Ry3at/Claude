<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Vazirmatn, Tahoma, sans-serif">
<rect x="0" y="0" width="900" height="400" rx="0" fill="#F2F5FF"/>
<rect x="0" y="0" width="900" height="10" rx="0" fill="#2D3A8C"/>
<text x="870" y="56" font-family="Vazirmatn, Tahoma, sans-serif" font-size="27" fill="#1E2761" font-weight="700" text-anchor="start" direction="rtl">الگو یعنی قاعده</text>
<text x="870" y="84" font-family="Vazirmatn, Tahoma, sans-serif" font-size="17" fill="#8C97AB" font-weight="400" text-anchor="start" direction="rtl">بعدی چه رنگی است؟</text>
<circle cx="760" cy="200" r="48" fill="#FF6B6B"/>
<circle cx="630" cy="200" r="48" fill="#3D7BE0"/>
<circle cx="500" cy="200" r="48" fill="#FF6B6B"/>
<circle cx="370" cy="200" r="48" fill="#3D7BE0"/>
<rect x="188" y="148" width="104" height="104" rx="18" fill="#FFF6DC" stroke="#FFC93C" stroke-width="3" stroke-dasharray="7 6"/>
<text x="240" y="218" font-family="Vazirmatn, Tahoma, sans-serif" font-size="50" fill="#FFC93C" font-weight="700" text-anchor="middle" direction="rtl">؟</text>
<rect x="170" y="290" width="560" height="56" rx="28" fill="#FFFFFF" stroke="#06BEB6" stroke-width="3"/>
<text x="450" y="326" font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#3C4A5E" font-weight="600" text-anchor="middle" direction="rtl">قاعده: یکی در میان قرمز و آبی  ←  بعدی قرمز است</text>
<text x="450" y="382" font-family="Vazirmatn, Tahoma, sans-serif" font-size="16" fill="#8C97AB" font-weight="400" text-anchor="middle" direction="rtl">اگر قاعده را پیدا کنی، بعدی را می‌دانی — بدون شانس.</text>
</svg>
